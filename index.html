<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Bot Saludador</title>
  </head>
  <body>
    <h1>Hola</h1>
    <form id="formulario">
    <label id="nombre-label" for="nombre">¿Cuál es tu nombre?</label>

    <input type="text" id="nombre" name="nombre"/>

    <label id="sexo-label" for="sexo">Sexo:</label>

    <select id="sexo" name="sexo">
     <option value="">Selecciona una opción</option>
     <option value="masculino">Masculino</option>
     <option value="femenino">Femenino</option>
    </select>

    <label id="edad-label" for="edad">¿Cuál es tu edad?</label>

    <input type="number" id="edad" name="edad" required />

    <label id="idioma-label" for="idioma">Idioma:</label>
    <select id="idioma" name="idioma">
     <option value="">Selecciona una opción</option>
     <option value="es">Español</option>
     <option value="en">Inglés</option>
    </select>
    <input type="submit" value="Saludar" id="saludar-button"/>
    </form>
    <div id="resultado-div"></div>
    


    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
