<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Bot Saludador</title>
  </head>
  <body>
    <h1>Hola</h1>
    <form id="formulario">
      <label for="nombre">Cual es tu nombre?</label>
      <input type="text" id="nombre" name="nombre" required />
      <label for="sexo">Sexo:</label>
      <select id="sexo" name="sexo">
        <option value="">Selecciona una opción</option>
        <option value="masculino">Masculino</option>
        <option value="femenino">Femenino</option>
      </select>
      <label for="edad">Cual es tu edad?</label>
      <input type="number" id="edad" name="edad" required />
      <input type="submit" value="Saludar" id="saludar-button" />
    </form>
    <div id="resultado-div"></div>
    


    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
